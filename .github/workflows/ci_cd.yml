name: MLOps CI/CD Training Metrics Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify-metrics-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Cache Hugging Face Models
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-hf-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-hf-

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install matplotlib numpy torch torchaudio transformers accelerate webdataset soundfile librosa deep-translator tensorboard tqdm

    - name: "Stage 1: Syntax & Compilation Check"
      run: |
        echo "=== Running Python Syntax Compilation Check ==="
        python -m py_compile app_gui.py plot_loss.py zip_app.py run_kaggle.py

    - name: "Stage 2: Adapt Dataset Paths for Linux Runner"
      run: |
        echo "=== Rewriting Windows Paths to Linux Workspace Paths ==="
        for split in train dev; do
          lst_path="data/finetune/tokens/${split}/data.lst"
          if [ -f "$lst_path" ]; then
            # Thay thế đường dẫn Windows thành đường dẫn hiện tại của GitHub Actions Runner
            sed -i "s|D:\\\src\\\NPL\\\OmniVoice\\\|${GITHUB_WORKSPACE}/|g" "$lst_path"
            sed -i "s|d:\\\src\\\NPL\\\OmniVoice\\\|${GITHUB_WORKSPACE}/|g" "$lst_path"
            sed -i "s|D:/src/NPL/OmniVoice/|${GITHUB_WORKSPACE}/|g" "$lst_path"
            sed -i "s|d:/src/NPL/OmniVoice/|${GITHUB_WORKSPACE}/|g" "$lst_path"
            sed -i 's|\\|/|g' "$lst_path"
            echo "Successfully adapted paths in: $lst_path"
            head -n 2 "$lst_path"
          fi
        done

    - name: "Stage 3: MLOps Continuous Training (CT) Integration Smoke Test (CPU)"
      run: |
        echo "=== Running Training Pipeline Smoke Test (2 Steps on CPU) ==="
        export PYTHONPATH=$PYTHONPATH:.
        python -m omnivoice.cli.train \
          --train_config examples/config/train_config_finetune_sdpa.json \
          --data_config examples/config/data_config_finetune.json \
          --output_dir exp/smoke_test \
          --steps 2 \
          --batch_tokens 200 \
          --mixed_precision no \
          --attn_implementation sdpa

    - name: "Stage 4: Verify Output Metrics & Quality Gate"
      run: |
        echo "=== Verifying Generated CSV Metrics and Loss Curves ==="
        # Kiểm tra sự tồn tại của file log thực tế sau smoke test
        if [ -f "exp/smoke_test/metrics_log.csv" ]; then
          echo "Success: metrics_log.csv generated by real training logger!"
          head -n 5 exp/smoke_test/metrics_log.csv
        fi
        # Chạy kiểm soát chất lượng bằng plot_loss
        python plot_loss.py --check-threshold

    - name: "Stage 5: Archive Training Visualizations & CSV Log"
      uses: actions/upload-artifact@v4
      with:
        name: omnivoice-training-artifacts
        path: |
          output/loss_curve.png
          output/metrics_log.csv
          exp/smoke_test/metrics_log.csv
        retention-days: 7

  trigger-kaggle-training:
    name: Trigger Continuous Training on Kaggle GPU
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Check Secrets & Install Kaggle API
      env:
        KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      run: |
        if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
          echo "WARNING: Kaggle credentials are not configured in GitHub Secrets. Skipping Kaggle trigger."
          exit 0
        fi
        python -m pip install --upgrade pip
        pip install kaggle

    - name: Configure Kaggle Credentials & Push Kernel
      env:
        KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        KAGGLE_DATASET_SLUG: ${{ secrets.KAGGLE_DATASET_SLUG }}
      run: |
        if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
          echo "Skipping step because credentials are not present."
          exit 0
        fi
        
        mkdir -p ~/.kaggle
        echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
        chmod 600 ~/.kaggle/kaggle.json
        
        DATASET_SLUG="lelong181/omnivoice-dataset"
        if [ -n "$KAGGLE_DATASET_SLUG" ]; then
          DATASET_SLUG="$KAGGLE_DATASET_SLUG"
        fi
        
        cat <<EOF > kernel-metadata.json
        {
          "id": "${KAGGLE_USERNAME}/omnivoice-continuous-training",
          "title": "OmniVoice Continuous Training",
          "code_file": "run_kaggle.py",
          "language": "python",
          "kernel_type": "script",
          "is_private": true,
          "enable_gpu": true,
          "enable_tpu": false,
          "enable_internet": true,
          "dataset_sources": [
            "${DATASET_SLUG}"
          ],
          "kernel_sources": [],
          "competition_sources": []
        }
        EOF
        
        echo "=== Generated kernel-metadata.json ==="
        cat kernel-metadata.json
        
        echo "=== Pushing Kernel to Kaggle ==="
        kaggle kernels push -p .
        echo "=== Kernel successfully pushed and triggered! ==="
        echo "Monitor your training run here: https://www.kaggle.com/${KAGGLE_USERNAME}/omnivoice-continuous-training"
